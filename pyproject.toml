[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "procurerpa-enterprise"
version = "0.1.0"
description = "Procurement RPA enterprise prototype built on Skyvern"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    # === Skyvern core ===
    "fastapi>=0.121.0,<0.129",
    "uvicorn>=0.27.1,<1",
    "starlette>=0.46.2,<1",
    "starlette-context>=0.4.0,<1",
    "sse-starlette>=2.1.0,<4",
    "sqlalchemy>=2.0.29,<3",
    "alembic>=1.13.1,<2",
    "psycopg[binary]>=3.1.18,<4",
    "asyncpg>=0.29.0,<1",
    "pydantic>=2.6.4,<3",
    "pydantic-settings>=2.2.1,<3",
    "openai>=1.66.5,<2",
    "litellm>=1.63.11,<1.64",
    "anthropic>=0.50.0,<0.51",
    "playwright>=1.46.0,<2",
    "pillow>=10.3.0,<13",
    "psutil>=5.9.8,<8",
    "httpx>=0.27.0,<1",
    "google-auth>=2.29.0,<3",
    "aiohttp>=3.9.3,<4",
    "aiofiles>=23.2.1,<24",
    "asyncache>=0.3.1,<1",
    "cachetools>=5.3.0,<7",
    "curlparser>=0.1.0,<1",
    "websockets>=12.0,<14",
    "zstandard>=0.22.0,<1",
    "structlog>=24.1.0,<25",
    "typer>=0.12.0,<1",
    "tldextract>=5.1.0,<6",
    "orjson>=3.10.0,<4",
    "opentelemetry-api>=1.24.0,<2",
    "onepassword-sdk>=0.3.2,<1",
    "posthog>=3.5.0,<7",
    "jinja2>=3.1.3,<4",
    "json-repair>=0.30.0,<1",
    "lark>=1.1.9,<2",
    "libcst>=1.4.0,<2",
    "email-validator>=2.1.0,<3",
    "filetype>=1.2.0,<2",
    "pandas>=2.2.0,<3",
    "pdfplumber>=0.11.0,<1",
    "pypdf>=4.2.0,<7",
    "python-docx>=1.1.0,<2",
    "python-dotenv>=1.0.1,<2",
    "python-multipart>=0.0.9,<1",
    "pyotp>=2.9.0,<3",
    "aioboto3>=12.3.0,<14",
    "azure-identity>=1.16.0,<2",
    "azure-keyvault-secrets>=4.8.0,<5",
    "azure-storage-blob>=12.19.0,<13",
    "types-boto3[batch,ec2,ecs,s3,secretsmanager]>=1.36.0,<2",
    # === Enterprise extensions ===
    "redis>=5.0.3,<6",
    "minio>=7.2.0,<8",
    "python-jose[cryptography]>=3.3.0,<4",
    "passlib[bcrypt]>=1.7.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1,<9",
    "pytest-asyncio>=0.23.5,<1",
    "pytest-cov>=5.0.0,<6",
    "fakeredis>=2.21.0,<3",
    "ruff>=0.3.4,<1",
    "mypy>=1.9.0,<2",
    "isort>=5.13.2,<6",
    "ipython>=8.22.2,<9",
]

[tool.hatch.build.targets.wheel]
packages = [
    "skyvern",
    "alembic",
    "enterprise",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "skyvern-frontend",
    "node_modules",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = ["eval", "tests/sdk", "skyvern-frontend", "node_modules"]
asyncio_mode = "auto"
